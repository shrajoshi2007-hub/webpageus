<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="mark"><span class="dot"></span><span>YOURAPP</span></div>
    <div class="card">
      <h1>Create your account</h1>
      <p class="lede">Fill in your details below. This takes a minute.</p>

      <form id="signupForm">
        <div class="row-2">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" required autocomplete="family-name">
          </div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel">
        </div>

        <div class="field">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="dob">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">
        </div>

        <button type="submit" class="btn btn-primary submit">Create account</button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to homepage</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();

      // No backend here — this just keeps the first name so the homepage
      // can greet you, then sends you back to the homepage.
      const firstName = document.getElementById('firstName').value.trim();
      if (firstName) {
        localStorage.setItem('userName', firstName);
      }

      window.location.href = 'index.html?signedup=1';
    });
  </script>
</body>
</html>
