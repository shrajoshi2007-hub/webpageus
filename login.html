<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="mark"><span class="dot"></span><span>YOURAPP</span></div>
    <div class="card">
      <h1>Log in</h1>
      <p class="lede">Enter your email and password to continue.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary submit">Log in</button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to homepage</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // No backend here — this just sends you back to the homepage.
      window.location.href = 'index.html?loggedin=1';
    });
  </script>
</body>
</html>
